# Render blueprint for deploying the Flask app (Python)
# Uses the root app.py entrypoint.

services:
  - type: web
    name: maize-prediction
    runtime: python
    pythonVersion: 3.11.9

    plan: starter

    region: oregon
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "gunicorn backend.app:create_app --bind 0.0.0.0:10000"

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      # Add your Neon URL here in Render Dashboard as DATABASE_URL
